name: Public portfolio language analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/language_stats.py'
      - '.github/workflows/language-stats.yml'

permissions:
  contents: write

concurrency:
  group: public-portfolio-language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify deterministic analytics and generate chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/language_stats.py
      - name: Commit generated public chart only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/language-stats.svg
          if git diff --cached --quiet; then
            echo 'Language analytics unchanged.'
            exit 0
          fi
          git commit -m 'Refresh public portfolio language analytics'
          git push origin HEAD:main
